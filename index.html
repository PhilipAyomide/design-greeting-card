<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card</title>
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="card" id="greeting-card">
      <h1>Happy Birthday!</h1>

      <p class="message">
        Wishing you all the happiness and joy on your special day!
      </p>

      <div class="card-links">
        <a href="#send" class="send-link">Send Card</a>
        <a href="#share" class="share-link">Share on Social Media</a>
      </div>
  	</div>

  <section id="send">
    <h2>Sending your card...</h2>
    <p>Card successfully sent to your recipient!</p>
  </section>

  <section id="share">
    <h2>Sharing your card...</h2>
    <p>Your card was shared on social media!</p>
  </section>

  <section id="application-form">
    <h1>Job Application Form</h1>
    <div class="container">
    <form>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name"><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email"><br>
        <label for="position">Job Position:</label><br>
        <select id="position">
            <option value="" disabled selected>Select your position</option>
            <option value="developer">Developer</option>
            <option value="manager">Manager</option>
            <option value="designer">Designer</option>
        </select>
        <fieldset class="radio-group">
          <legend>Availability</legend>
            <input type="radio" id="Full-Time" name="availability">
            <label for="Full-Time">Full Time</label>
            <input type="radio" id="Part-Time" name="availability">
            <label for="Part-Time">Part Time</label>
            <input type="radio" id="Contract" name="availability">
            <label for="Contract">Contract</label>
        </fieldset>
        <label for="message">Why do you want this job?</label><br>
        <textarea id="message">
        </textarea><br>
        <button type="submit">SUBMIT APPLICATION</button>
      </form>
    </dv>
  </section>
</body>
</html>
